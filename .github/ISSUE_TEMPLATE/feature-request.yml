name: Feature request
description: Propose a new feature or change
labels:
    - needs-triage
body:
    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What problem does this solve, or what friction do you hit today?
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposal
          description: What should the plugin do instead?
      validations:
          required: true
