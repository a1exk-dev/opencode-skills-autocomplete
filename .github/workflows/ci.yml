name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - name: Lint
              run: bun run check
            - name: Typecheck
              run: bun run typecheck
            - name: Test
              run: bun run test
            - name: Spellcheck
              run: bun run spell
